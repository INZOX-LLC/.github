<svg xmlns="http://www.w3.org/2000/svg" width="200" height="56" viewBox="0 0 200 56" role="img" aria-labelledby="t d" fill="none"><title id="t">Book a call</title><desc id="d">Book a call button</desc><style>@font-face{font-family:'IZ Display';src:url(data:font/woff2;base64,) format('woff2');}
