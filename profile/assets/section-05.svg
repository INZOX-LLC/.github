<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="112" viewBox="0 0 1280 112" role="img" aria-labelledby="t d" fill="none"><title id="t">05 — The toolchain behind the work.</title><desc id="d">Section header: The Stack — The toolchain behind the work.</desc><style>@font-face{font-family:'IZ Display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IZ Mono';src:url(data:font/woff2;base64,) format('woff2');}
