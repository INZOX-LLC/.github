<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d" fill="none"><title id="t">Let's build something extraordinary together</title><desc id="d">Closing banner: We Deliver First. Let's build something extraordinary together.</desc><style>@font-face{font-family:'IZ Display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IZ Mono';src:url(data:font/woff2;base64,) format('woff2');}
